<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Invoice Creator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #262b36;
      --text: #e7e9ee;
      --muted: #8a92a6;
      --accent: #6366f1;
      --accent-hover: #7c7ff5;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(600px circle at 20% 0%, rgba(99, 102, 241, 0.15), transparent 45%),
        radial-gradient(600px circle at 80% 100%, rgba(56, 189, 248, 0.10), transparent 45%),
        var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
    }
    .brand .mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
    }
    .brand span { font-weight: 600; font-size: 1.05rem; letter-spacing: -0.01em; }
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.75rem; }
    .field { margin-bottom: 1.1rem; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 0.9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: #4d5566; }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0.4rem 0 1.6rem;
      font-size: 0.85rem;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted);
      cursor: pointer;
    }
    .remember input { accent-color: var(--accent); }
    a { color: var(--accent); text-decoration: none; font-weight: 500; }
    a:hover { color: var(--accent-hover); }
    button {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }
    .foot {
      margin-top: 1.6rem;
      text-align: center;
      font-size: 0.88rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <form class="card" onsubmit="return false;">
    <div class="brand">
      <div class="mark">IC</div>
      <span>Invoice Creator</span>
    </div>

    <h1>Welcome back</h1>
    <p class="sub">Sign in to continue to your dashboard</p>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@company.com" autocomplete="username">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
    </div>

    <div class="row">
      <label class="remember"><input type="checkbox"> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>

    <button type="submit">Sign in</button>

    <p class="foot">Don't have an account? <a href="#">Create one</a></p>
  </form>
</body>
</html>
