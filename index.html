<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e1e1e;
      color: #1e90ff;
    }
    .card {
      width: 100%;
      max-width: 360px;
      padding: 2.5rem 2rem;
      background: #262626;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      text-align: center;
    }
    p.sub {
      margin: 0 0 1.75rem;
      text-align: center;
      color: #6a90b0;
      font-size: 0.9rem;
    }
    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      margin-bottom: 1.1rem;
      background: #1e1e1e;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
    }
    input:focus {
      outline: none;
      border-color: #1e90ff;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 0.82rem;
    }
    .row label {
      text-transform: none;
      letter-spacing: normal;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    a { color: #1e90ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button {
      width: 100%;
      padding: 0.8rem;
      background: #1e90ff;
      border: none;
      border-radius: 8px;
      color: #1e1e1e;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
    }
    button:hover { background: #4da6ff; }
    p.foot {
      margin: 1.5rem 0 0;
      text-align: center;
      font-size: 0.85rem;
      color: #6a90b0;
    }
  </style>
</head>
<body>
  <form class="card" onsubmit="return false;">
    <h1>TEST VERSION MARK 1</h1>
    <p class="sub">Sign in to your account</p>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">

    <div class="row">
      <label><input type="checkbox"> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>

    <button type="submit">Sign In</button>

    <p class="foot">Don't have an account? <a href="#">Sign up</a></p>
  </form>
</body>
</html>
