<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <div id="app" class="shell" hidden>
    <header class="topbar">
      <button type="button" class="menu-btn" id="nav-toggle" aria-expanded="false" aria-controls="sidebar">Menu</button>
      <p class="wordmark topbar-mark"><b>Invoice Creator</b></p>
      <div class="account-wrap">
        <button type="button" id="account-btn" class="account-btn" aria-haspopup="true" aria-expanded="false" aria-controls="account-menu">
          <span class="avatar" id="avatar" aria-hidden="true">··</span>
          <span class="sr-only">Account menu</span>
        </button>
        <div id="account-menu" class="account-menu" role="menu" hidden>
          <p class="account-name" id="acct-name"></p>
          <p class="account-email" id="acct-email"></p>
          <p class="account-role" id="acct-role"></p>
          <button type="button" id="signout" class="link" role="menuitem">Sign out</button>
        </div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <p class="wordmark"><b>Invoice Creator</b></p>
      <nav id="nav">
        <a href="/app/dashboard" data-nav="dashboard">Dashboard</a>
        <a href="/app/invoices" data-nav="invoices">Invoices</a>
        <a href="/app/customers" data-nav="customers">Customers</a>
        <a href="/app/settings/business" data-nav="settings">Settings</a>
      </nav>
    </aside>

    <main id="view" class="view" aria-live="polite"></main>

    <!-- Support widget -->
    <button type="button" id="support-btn" class="support-btn" hidden aria-expanded="false" aria-controls="support-panel">
      <span aria-hidden="true">💬</span> Support
      <span id="support-badge" class="support-badge" hidden></span>
    </button>
    <section id="support-panel" class="support-panel" hidden aria-label="Support chat"></section>
  </div>

  <script src="/app/app.js"></script>
</body>
</html>
