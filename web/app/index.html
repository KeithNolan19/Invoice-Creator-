<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <div id="app" class="shell" hidden>
    <header class="topbar">
      <p class="wordmark"><b>Invoice Creator</b></p>
      <button type="button" class="menu-btn" id="nav-toggle" aria-expanded="false" aria-controls="sidebar">Menu</button>
    </header>

    <aside class="sidebar" id="sidebar">
      <p class="wordmark"><b>Invoice Creator</b></p>
      <nav id="nav">
        <a href="/app/dashboard" data-nav="dashboard">Dashboard</a>
        <a href="/app/invoices" data-nav="invoices">Invoices</a>
        <a href="/app/customers" data-nav="customers">Customers</a>
        <a href="/app/settings/business" data-nav="settings">Settings</a>
      </nav>
      <div class="sidebar-foot">
        <span class="who" id="who"></span>
        <span class="role" id="role"></span>
        <button type="button" id="signout" class="link">Sign out</button>
      </div>
    </aside>

    <main id="view" class="view" aria-live="polite"></main>
  </div>

  <script src="/app/app.js"></script>
</body>
</html>
